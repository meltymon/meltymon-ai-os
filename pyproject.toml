[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meltymon-ai-os"
version = "0.1.0"
description = "A modular, local-first AI orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "MELTYMON AI OS Contributors" }
]

keywords = [
    "ai",
    "artificial-intelligence",
    "local-ai",
    "ai-orchestration",
    "ollama",
    "monitoring",
    "linux",
    "multi-gpu"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring"
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "psutil>=5.9"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23"
]

[project.urls]
Homepage = "https://github.com/meltymon/meltymon-ai-os"
Repository = "https://github.com/meltymon/meltymon-ai-os"
Documentation = "https://github.com/meltymon/meltymon-ai-os#readme"
Changelog = "https://github.com/meltymon/meltymon-ai-os/blob/main/CHANGELOG.md"
Issues = "https://github.com/meltymon/meltymon-ai-os/issues"
Contributing = "https://github.com/meltymon/meltymon-ai-os/blob/main/CONTRIBUTING.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meltymon_ai_os.config" = ["settings.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
