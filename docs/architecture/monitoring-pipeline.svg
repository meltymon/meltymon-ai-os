<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">MELTYMON AI OS — Monitoring Pipeline</title><desc id="desc">Monitoring service collects CPU and memory, NUMA, and GPU telemetry into a system snapshot, then evaluates health, runs diagnostics and returns a monitoring result.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b3d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#67e8f9"/></marker></defs><rect width="1600" height="700" rx="28" fill="url(#bg)"/><text x="70" y="75" fill="#f8fafc" font-family="Inter,Arial" font-size="38" font-weight="700">Monitoring Pipeline</text><text x="70" y="112" fill="#94a3b8" font-family="Inter,Arial" font-size="20">Collect → normalize → evaluate → diagnose → report</text>
<g font-family="Inter,Arial" text-anchor="middle"><rect x="70" y="190" width="270" height="115" rx="18" fill="#123b38" stroke="#34d399" stroke-width="2"/><text x="205" y="230" fill="#a7f3d0" font-size="19" font-weight="700">DATA SOURCES</text><text x="205" y="265" fill="#ecfdf5" font-size="18">CPU · RAM · NUMA · GPU</text>
<rect x="395" y="190" width="230" height="115" rx="18" fill="#153451" stroke="#38bdf8" stroke-width="2"/><text x="510" y="235" fill="#bae6fd" font-size="20" font-weight="700">SystemMonitor</text><text x="510" y="270" fill="#e0f2fe" font-size="16">collect telemetry</text>
<rect x="680" y="190" width="230" height="115" rx="18" fill="#153451" stroke="#38bdf8" stroke-width="2"/><text x="795" y="235" fill="#bae6fd" font-size="20" font-weight="700">SystemSnapshot</text><text x="795" y="270" fill="#e0f2fe" font-size="16">normalized state</text>
<rect x="965" y="190" width="230" height="115" rx="18" fill="#3b2b63" stroke="#a78bfa" stroke-width="2"/><text x="1080" y="235" fill="#ddd6fe" font-size="20" font-weight="700">HealthEvaluator</text><text x="1080" y="270" fill="#f5f3ff" font-size="16">rules · thresholds</text>
<rect x="1250" y="190" width="280" height="115" rx="18" fill="#3b2b63" stroke="#a78bfa" stroke-width="2"/><text x="1390" y="235" fill="#ddd6fe" font-size="20" font-weight="700">HealthReport</text><text x="1390" y="270" fill="#f5f3ff" font-size="16">status · findings</text>
<rect x="965" y="430" width="230" height="115" rx="18" fill="#4a2b24" stroke="#fb923c" stroke-width="2"/><text x="1080" y="475" fill="#fed7aa" font-size="20" font-weight="700">DiagnosticEngine</text><text x="1080" y="510" fill="#ffedd5" font-size="16">rule-based analysis</text>
<rect x="1250" y="430" width="280" height="115" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="1390" y="475" fill="#a5f3fc" font-size="20" font-weight="700">MonitoringResult</text><text x="1390" y="510" fill="#ecfeff" font-size="16">snapshot + reports</text></g>
<g stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M340 247 H388"/><path d="M625 247 H673"/><path d="M910 247 H958"/><path d="M1195 247 H1243"/><path d="M1390 305 V420"/><path d="M1250 487 H1203"/></g>
<rect x="70" y="430" width="800" height="115" rx="18" fill="#172b3d" stroke="#475569" stroke-width="2"/><text x="105" y="475" fill="#e2e8f0" font-family="Inter,Arial" font-size="20" font-weight="700">Failure isolation</text><text x="105" y="512" fill="#cbd5e1" font-family="Inter,Arial" font-size="18">Unavailable devices or telemetry fields should not unnecessarily stop other collectors.</text>
<text x="70" y="640" fill="#64748b" font-family="Inter,Arial" font-size="16">Based on the documented MonitoringService → SystemMonitor → HealthEvaluator → DiagnosticEngine flow.</text></svg>