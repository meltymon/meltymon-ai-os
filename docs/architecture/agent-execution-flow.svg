<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">MELTYMON AI OS — Agent Execution Flow</title><desc id="desc">Agent context enters execution manager and policy, is dispatched by orchestrator through a factory registry to an agent implementation, which uses an injected backend and returns an agent result and execution report.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b3d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#67e8f9"/></marker></defs><rect width="1600" height="700" rx="28" fill="url(#bg)"/><text x="70" y="75" fill="#f8fafc" font-family="Inter,Arial" font-size="38" font-weight="700">Agent Execution Flow</text><text x="70" y="112" fill="#94a3b8" font-family="Inter,Arial" font-size="20">A controlled, observable path from request context to execution report</text>
<g font-family="Inter,Arial" text-anchor="middle"><rect x="65" y="220" width="210" height="125" rx="18" fill="#153451" stroke="#38bdf8" stroke-width="2"/><text x="170" y="265" fill="#bae6fd" font-size="20" font-weight="700">AgentContext</text><text x="170" y="300" fill="#e0f2fe" font-size="16">request data</text>
<rect x="325" y="220" width="240" height="125" rx="18" fill="#153451" stroke="#38bdf8" stroke-width="2"/><text x="445" y="265" fill="#bae6fd" font-size="20" font-weight="700">ExecutionManager</text><text x="445" y="300" fill="#e0f2fe" font-size="16">policy · limits · timeout</text>
<rect x="615" y="220" width="210" height="125" rx="18" fill="#3b2b63" stroke="#a78bfa" stroke-width="2"/><text x="720" y="265" fill="#ddd6fe" font-size="20" font-weight="700">Orchestrator</text><text x="720" y="300" fill="#f5f3ff" font-size="16">dispatch</text>
<rect x="875" y="220" width="220" height="125" rx="18" fill="#3b2b63" stroke="#a78bfa" stroke-width="2"/><text x="985" y="265" fill="#ddd6fe" font-size="20" font-weight="700">AgentRegistry</text><text x="985" y="300" fill="#f5f3ff" font-size="16">factory lookup</text>
<rect x="1145" y="220" width="190" height="125" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="1240" y="265" fill="#a5f3fc" font-size="20" font-weight="700">Agent</text><text x="1240" y="300" fill="#ecfeff" font-size="16">run(context)</text>
<rect x="1145" y="455" width="190" height="105" rx="18" fill="#3b2b63" stroke="#a78bfa" stroke-width="2"/><text x="1240" y="495" fill="#ddd6fe" font-size="19" font-weight="700">Backend</text><text x="1240" y="525" fill="#f5f3ff" font-size="15">injected provider</text>
<rect x="1370" y="220" width="180" height="125" rx="18" fill="#123b38" stroke="#34d399" stroke-width="2"/><text x="1460" y="265" fill="#a7f3d0" font-size="20" font-weight="700">AgentResult</text><text x="1460" y="300" fill="#ecfdf5" font-size="16">structured outcome</text></g>
<g stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M275 282 H318"/><path d="M565 282 H608"/><path d="M825 282 H868"/><path d="M1095 282 H1138"/><path d="M1335 282 H1363"/><path d="M1240 345 V448"/></g>
<rect x="325" y="455" width="770" height="105" rx="18" fill="#172b3d" stroke="#475569" stroke-width="2"/><text x="360" y="495" fill="#e2e8f0" font-family="Inter,Arial" font-size="20" font-weight="700">ExecutionReport</text><text x="360" y="530" fill="#cbd5e1" font-family="Inter,Arial" font-size="18">Records · status · timing · correlation metadata · structured failures</text>
<path d="M1460 345 V405 H710 V448" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="70" y="640" fill="#64748b" font-family="Inter,Arial" font-size="16">Current foundation. End-to-end authorization, persistent memory and policy enforcement remain planned integration work.</text></svg>